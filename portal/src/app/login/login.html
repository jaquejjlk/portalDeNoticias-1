<div class="min-h-screen bg-black/40">

    <div class="flex min-h-screen items-center justify-center px-4 py-10">


        <div
            class="relative w-full max-w-[410px] bg-white px-10 py-10 shadow-2xl">

            <a
                routerLink="/acontecendo"
                class="absolute right-5 top-4 text-3xl font-light text-black transition hover:text-gray-500"
                aria-label="Fechar login"
            >
                ×
            </a>

            <h1 class="mb-6 text-center text-3xl font-bold text-black">
                Login
            </h1>


            <div class="grid grid-cols-2 gap-8">

                <button
                    class="flex h-10 items-center justify-center gap-3 border border-gray-500 text-sm transition hover:bg-gray-100">

                    <span class="text-lg font-bold text-red-500">
                        G
                    </span>

                    Google

                </button>

                <button
                    class="flex h-10 items-center justify-center gap-3 border border-gray-500 text-sm transition hover:bg-gray-100">

                    <span
                        class="flex h-5 w-5 items-center justify-center rounded-full bg-blue-600 font-bold text-white">
                        f
                    </span>

                    Facebook

                </button>

            </div>

            <div class="my-5 flex items-center gap-3">

                <div class="h-px flex-1 bg-gray-500"></div>

                <span class="text-sm text-gray-600">
                    ou
                </span>

                <div class="h-px flex-1 bg-gray-500"></div>

            </div>

            <p class="mb-5 text-sm leading-5 text-gray-800">

                Digite suas informações de login para acessar
                sua conta.

            </p>


            <p class="mb-3 text-sm text-gray-800">

                Não tem uma conta?

                <a
                    routerLink="/cadastro"
                    class="font-bold underline transition hover:text-purple-600">

                    Cadastre-se

                </a>

            </p>


            <input
                type="email"
                placeholder="E-mail *"
                class="mb-4 h-11 w-full border border-gray-500 px-3 text-sm outline-none transition focus:border-black"
            >

            <div class="relative">

                <input
                    type="password"
                    placeholder="Senha *"
                    class="h-11 w-full border border-gray-500 px-3 pr-10 text-sm outline-none transition focus:border-black"
                >

                <span
                    class="absolute right-4 top-3 text-sm">

                    🔒

                </span>

            </div>

            <a
                href="#"
                class="mt-3 block text-sm text-blue-500 underline hover:text-blue-700">

                Esqueceu a sua senha?

            </a>

            <button
                class="mt-6 h-12 w-full bg-black text-xl font-bold text-white transition hover:bg-purple-600">

                ENTRAR

            </button>

        </div>

    </div>

</div>
