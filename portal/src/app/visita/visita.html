
<main class="w-full bg-white">  
  
  <!-- BANNER --> 
  <section  
    class="relative h-[268px] w-full overflow-hidden bg-gradient-to-r from-blue-700 via-indigo-600 to-purple-600" 
  >  
 
    <!-- EFEITOS DE FUNDO --> 
    <div  
      class="absolute -right-24 -top-32 h-[420px] w-[420px] rounded-full bg-purple-400 opacity-20" 
    ></div> 
 
    <div  
      class="absolute -bottom-40 left-[35%] h-[400px] w-[400px] rounded-full bg-blue-400 opacity-20" 
    ></div> 
 
 
    <!-- TEXTO PRINCIPAL --> 
    <div class="absolute left-[28%] top-8 text-white">  
  
      <p class="text-3xl font-bold leading-tight">  
        Tudo sobre o universo  
      </p>  
  
      <p class="text-[64px] font-black leading-none tracking-tight">  
        POPVERSE  
      </p> 
 
      <p class="mt-2 text-lg font-medium"> 
        música • filmes • séries • games • cultura pop 
      </p> 
  
    </div>  
  
  
    <!-- VER NOTÍCIAS --> 
    <a  
      routerLink="/acontecendo" 
      class="absolute left-[59%] top-[140px] rounded-full border-2 border-white px-10 py-1 text-4xl font-bold text-white transition duration-300 hover:bg-white hover:text-purple-600" 
    >  
      ver notícias ↗ 
    </a>  
  
  
    <!-- NOVIDADE --> 
    <div  
      class="absolute -right-[70px] top-4 w-[400px] rotate-[20deg] bg-fuchsia-500 py-2 text-center text-4xl font-black tracking-wide text-white shadow-lg" 
    >  
      NOVIDADE  
    </div>  
  
  </section>  
  
  
  <!-- COOKIES -->  
  <section  
    id="cookie-banner"  
    class="flex min-h-[48px] w-full items-center justify-between bg-black px-8 py-2 text-white" 
  >  
  
    <p class="max-w-[700px] text-[10px] font-semibold leading-3">  
  
      Utilizamos os cookies para melhorar a sua experiência.  
      Para cumprir com a nova diretiva de privacidade,  
      nós precisamos pedir seu consentimento para definir os cookies.  
  
      <span class="cursor-pointer underline">  
        Saiba mais.  
      </span>  
  
    </p>  
  
    <div class="flex items-center gap-3">  
  
      <button  
        onclick="recusarCookies()"  
        class="border border-white px-6 py-2 text-[12px] transition duration-200 hover:bg-white hover:text-black" 
      >  
        Recusar  
      </button>  
  
      <button  
        onclick="aceitarCookies()"  
        class="border border-white bg-white px-7 py-2 text-[12px] text-black transition duration-200 hover:bg-gray-200" 
      >  
        Aceitar  
      </button>  
  
    </div>  
  
  </section>  
  
  
  <!-- SABER MAIS -->  
  <section class="mx-auto min-h-[475px] max-w-[830px] px-6 py-9">  
  
    <a  
      routerLink="/acontecendo"  
      class="block w-fit text-2xl font-normal text-black transition duration-200 hover:text-purple-600" 
    >  
      SABER MAIS ↗  
    </a>  
  
  
    <!-- IMAGEM MAIOR -->  
    <div class="mt-3 w-full">  
  
      <img  
        src="images/visita.jpg"  
        alt="Notícias Popverse"  
        class="h-auto w-full object-cover" 
      >  
  
    </div>  
  
  </section>  
  
</main>  
  
  
<script>  
  
  function aceitarCookies() {  
  
    localStorage.setItem("cookies", "aceito");  
  
    document  
      .getElementById("cookie-banner")  
      .classList.add("hidden");  
  
  }  
  
  
  function recusarCookies() {  
  
    localStorage.setItem("cookies", "recusado");  
  
    document  
      .getElementById("cookie-banner")  
      .classList.add("hidden");  
  
  }  
  
  
  window.addEventListener("load", function () {  
  
    const cookies =  
      localStorage.getItem("cookies");  
  
    if (cookies) {  
  
      document  
        .getElementById("cookie-banner")  
        .classList.add("hidden");  
  
    }  
  
  });  
  
</script>
