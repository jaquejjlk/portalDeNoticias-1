
<input  
    type="checkbox"  
    id="abrirModal"  
    class="peer hidden"  
/>  
 
 
<main class="px-6 py-10 md:px-8">  
 
<div class="text-center">
    <h1 class="text-4xl font-extrabold tracking-tight text-black md:text-[44px]">
        EVENTOS
    </h1>

    <p class="mt-3 text-xl text-gray-500 md:text-[24px]">
        Confira os próximos eventos promovidos pelo SENAI
    </p>
</div>
 
    <section class="mx-auto w-full max-w-[948px] bg-white px-7 py-6">  
 
        <div class="flex flex-col gap-7 md:flex-row">  
 

            <div class="shrink-0">  
 
                <img  
                    src="images/evento.jpg"  
                    alt="Eventos"  
                    class="h-[282px] w-[196px] rounded-xl object-cover"  
                />  
 
            </div>  
 
 
            <div class="min-w-0 flex-1">  
 
                <div class="flex items-start gap-4">  
 

                    <svg  
                        class="mt-1 h-8 w-8 shrink-0 text-red-600"  
                        viewBox="0 0 24 24"  
                        fill="none"  
                        stroke="currentColor"  
                        stroke-width="2.5"  
                    >  
 
                        <rect  
                            x="3"  
                            y="4"  
                            width="18"  
                            height="18"  
                            rx="2"  
                        />  
 
                        <path d="M16 2v4M8 2v4M3 10h18" />  
 
                        <path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01" />  
 
                    </svg>  
 
 
                    <div>  
 
                        <div class="text-[27px] leading-tight text-black">  
                            TER, 18/08/2026 • 20:40  
                        </div>  
 
                        <h2 class="mt-4 text-[28px] font-bold leading-tight">  
                            Biblioteca SENAI  
                        </h2>  
 
                    </div>  
 
                </div>  
 
            </div>  
 
        </div>  
 
 
        <div class="my-5 h-px bg-gray-200"></div>  
 
 
        <div class="grid grid-cols-1 gap-7 md:grid-cols-[1fr_1px_1fr]">  
 
 
            <div class="flex items-start gap-4">  
 
                <svg  
                    class="mt-1 h-8 w-8 shrink-0 text-red-600"  
                    viewBox="0 0 24 24"  
                    fill="currentColor"  
                >  
 
                    <path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5Z"/>  
 
                </svg>  
 
 
                <div>  
 
                    <h3 class="text-[24px] font-bold">  
                        Local  
                    </h3>  
 
                    <p class="mt-5 text-[18px] leading-6 text-gray-800">  
                        BR-470, km 470 - nº 2555 -<br />  
                        Navegantes, Rio do Sul - SC,<br />  
                        89162-528  
                    </p>  
 
                </div>  
 
            </div>  
 
            <div class="hidden bg-gray-200 md:block"></div>  
 
            <div class="md:pl-4">  
 
                <h3 class="text-[24px] font-bold">  
                    Entrada  
                </h3>  
 
                <div class="mt-4 flex items-center gap-3">  
 
                    <span class="text-[25px]">  
                        R$ 25,00  
                    </span>  
 
                    <span class="text-[16px] text-red-600 line-through">  
                        R$39,90  
                    </span>  
 
                </div>  
 
                <label  
                    for="abrirModal"  
                    class="mt-8 block w-full max-w-[220px] cursor-pointer rounded-full bg-black px-8 py-2 text-center text-[22px] font-bold text-white transition hover:bg-gray-800"  
                >  
                    COMPRAR  
                </label>  
 
            </div>  
 
        </div>  
 
    </section>  
 
</main>  
 
<div  
    class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 px-4 peer-checked:flex"  
>  
    <div  
        class="relative w-full max-w-[480px] bg-white px-6 py-8 shadow-2xl"  
    >  
 
        <label  
            for="abrirModal"  
            class="absolute right-4 top-2 cursor-pointer text-[32px] font-light leading-none text-black hover:text-gray-600"  
        >  
            ×  
        </label>  
 
        <h2 class="mb-8 text-center text-[34px] font-extrabold text-black">  
            Confirme seus dados  
        </h2>  

        <form>  

            <input  
                type="email"  
                placeholder="E-mail *"  
                required  
                class="mb-3 h-[45px] w-full border border-gray-400 px-3 text-[14px] outline-none focus:border-black"  
            />  
 
            <input  
                type="text"  
                placeholder="CPF *"  
                required  
                class="mb-7 h-[45px] w-full border border-gray-400 px-3 text-[14px] outline-none focus:border-black"  
            />  
 
            <div class="mb-6 grid grid-cols-1 gap-4 md:grid-cols-2">  
 
                <div class="w-full">  
 
                    <label 
                        for="endereco"
                        class="mb-1 block h-[20px] text-[14px] leading-5"
                    >
                        Endereço *
                    </label>

                    <input  
                        type="text"
                        id="endereco"
                        name="endereco"
                        placeholder="Endereço *"  
                        required  
                        class="box-border h-[45px] w-full border border-gray-400 px-3 text-[14px] leading-normal outline-none focus:border-black"  
                    />  
 
                </div>  

                <div class="w-full">  
 
                    <label  
                        for="telefone" 
                        class="mb-1 block h-[20px] text-[14px] leading-5" 
                    >  
                        Número do Telefone  
                    </label>  
 
                    <input  
                        type="tel"  
                        id="telefone" 
                        name="telefone" 
                        placeholder="(47) 99999-9999" 
                        maxlength="15"
                        pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
                        inputmode="tel"
                        required 
                        class="box-border h-[45px] w-full border border-gray-400 px-3 text-[14px] leading-normal outline-none focus:border-black"  
                    />  
 
                </div>  
 
            </div>  
 
            <div class="mb-8 grid grid-cols-1 gap-4 md:grid-cols-2">  
 
                <div>  
 
                    <label class="mb-1 block text-[14px]">  
                        Data de Nascimento  
                    </label>  
 
                    <input  
                        type="date"  
                        class="h-[45px] w-full border border-gray-400 px-3 text-[14px] outline-none focus:border-black"  
                    />  
 
                </div>  
 
                <div>  
 
                    <label class="mb-1 block text-[16px] font-bold">  
                        Opções de pagamento  
                    </label>  
 
                    <select  
                        required  
                        class="h-[45px] w-full border border-gray-400 bg-white px-3 text-[14px] outline-none focus:border-black"  
                    >  
 
                        <option value="" disabled selected></option>  
 
                        <option value="pix">  
                            PIX  
                        </option>  
 
                        <option value="cartao">  
                            Cartão de crédito  
                        </option>  
 
                        <option value="boleto">  
                            Boleto  
                        </option>  
 
                    </select>  
 
                </div>  
 
            </div>  
 
            <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">  
  
                <label  
                    for="abrirModal"  
                    class="flex h-[47px] cursor-pointer items-center justify-center bg-gray-300 px-3 text-center text-[13px] font-extrabold text-white transition hover:bg-gray-400"  
                >  
                    CONTINUAR COMPRANDO  
                </label>  
 
                <button  
                    type="submit"  
                    class="h-[47px] bg-black px-3 text-[15px] font-extrabold text-white transition hover:bg-gray-800"  
                >  
                    ✓ &nbsp; FINALIZAR COMPRA  
                </button>  
 
            </div>  
 
 
        </form>  
 
    </div>  
 
</div>
