<main class="px-6 py-10 md:px-8">
    
    <h1 class="text-4xl font-extrabold tracking-tight text-black md:text-[44px]">
        EVENTOS
    </h1>
    <p class="mt-3 text-xl text-gray-500 md:text-[24px]">Confira os próximos eventos promovidos pelo SENAI</p>

    <section class="mx-auto w-full max-w-[948px] bg-white px-7 py-6">
      <div class="flex flex-col gap-7 md:flex-row">

        <div class="shrink-0">
            <img src="images/evento.jpg" alt="Eventos" class="h-[282px] w-[196px] rounded-xl object-cover"/>
        </div>
        
        <div class="min-w-0 flex-1">
            <div class="flex items-start gap-4">

            <svg class="mt-1 h-8 w-8 shrink-0 text-red-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <rect x="3" y="4" width="18" height="18" rx="2" />
              <path d="M16 2v4M8 2v4M3 10h18" />
              <path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01" />
            </svg>

            <div>

              <div class="text-[27px] leading-tight text-black">
                TER, 18/08/2026 • 20:40
              </div>

              <h2 class="mt-4 text-[28px] font-bold leading-tight">
                Biblioteca SENAI
              </h2>

            </div>

          </div>
          
          <div class="my-5 h-px bg-gray-200"></div>

          <div class="grid grid-cols-1 gap-7 md:grid-cols-[1fr_1px_1fr]">

            <div>
                <div class="flex items-start gap-4">
                    <svg class="mt-1 h-8 w-8 shrink-0 text-red-600" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5Z"/>
                    </svg>
                <div>

                  <h3 class="text-[24px] font-bold">
                    Local
                  </h3>

                  <p class="mt-5 text-[18px] leading-6 text-gray-800">
                    BR-470, km 470 - nº 2555 -<br />
                    Navegantes, Rio do Sul - SC,<br />
                    89162-528
                  </p>

                </div>

              </div>

            </div>


            <!-- DIVISOR VERTICAL -->
            <div class="hidden bg-gray-200 md:block"></div>


            <!-- ENTRADA -->
            <div class="md:pl-4">

              <h3 class="text-[24px] font-bold">
                Entrada
              </h3>

              <div class="mt-4 flex items-center gap-3">

                <span class="text-[25px]">
                  R$ 25,00
                </span>

                <span class="text-[16px] text-red-600 line-through">
                  R$39,90
                </span>

              </div>


              <!-- COMPRAR -->
              <button
                id="btnComprar"
                type="button"
                class="mt-8 w-full max-w-[220px] rounded-full bg-black px-8 py-2 text-[22px] font-bold text-white transition hover:bg-gray-800"
              >
                COMPRAR
              </button>

            </div>

          </div>

        </div>

      </div>

    </section>

  </main>

  <div
    id="modal"
    class="fixed inset-0 z-50 hidden">
    <div
      id="modalOverlay"
      class="absolute inset-0 bg-black/45">
    </div>

    <div
      class="absolute left-1/2 top-1/2 w-[480px] max-w-[calc(100%-32px)] -translate-x-1/2 -translate-y-1/2 bg-white px-6 pb-10 pt-10 shadow-2xl"
    >

      <!-- Fechar -->
      <button
        id="btnFechar"
        type="button"
        class="absolute right-3 top-3 text-[36px] font-light leading-none"
      >
        ×
      </button>
